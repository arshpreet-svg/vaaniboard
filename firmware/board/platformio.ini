; VaaniBoard main-board firmware (classic ESP32 DevKit, WROOM-32).
; Pick the environment that matches your wiring:
;   esp32dev        4 core keys (Yes, No, Help, Stop) + access switch
;   esp32dev_8keys  4 core keys + 4 vocabulary keys (needs 10k pull-ups, see README "Wiring")

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    marcoschwartz/LiquidCrystal_I2C@1.1.4

[env:esp32dev]
build_flags = -DNUM_KEYS=4

[env:esp32dev_8keys]
build_flags = -DNUM_KEYS=8
